schema: 1
context_budget: 8000
claim_ttl_max: 2h
verifiers:
  compile:
    run: npm run compile
    default: true
  lint:
    run: npm run lint
    default: true
  test:
    run: npm test
roles:
  agent:
    can: [context, find, claim, log, done, new:task, new:adr:proposed]
    cannot: [adr:accept, adr:edit-constraint, task:close, delete]
  human:
    can: ["*"]
identities: {}
default_branch: main
