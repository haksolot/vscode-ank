name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The unit suite locates the real binary and reads its version, which is
      # the only thing that catches a platform where we cannot spawn it at all
      # -- on Windows the name on the PATH is a `.cmd` shim, and node refuses
      # to spawn one without a shell. Pinned, because the golden fixtures are
      # what detect drift in the contract; a floating install would turn an
      # upstream release into a red build here with nothing to say about it.
      - run: npm install --global @haksolot/ank@0.7.0
      - run: ank --version

      - run: npm run lint
      - run: npm run compile
      - run: npm test
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --out ank.vsix
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: ank.vsix
