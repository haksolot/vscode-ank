name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm test

      - name: The tag and the manifest must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$declared" ]; then
            echo "tag $tag does not match package.json $declared" >&2
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - name: The icon must be the one the script draws
        run: |
          npm run icon
          git diff --exit-code -- resources/icon.png

      - run: npx vsce package --out "ank-${GITHUB_REF_NAME}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ./*.vsix
        env:
          GH_TOKEN: ${{ github.token }}
