name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# One `.vsix` is built once and then goes three places: the GitHub release, the
# VS Code Marketplace and Open VSX. Publishing that exact file rather than
# repackaging per registry is what makes the bytes a user installs from a fork
# the same bytes that were tested here.
jobs:
  release:
    runs-on: ubuntu-latest
    # Federation identifies a workflow by a subject, and a tag cannot be one:
    # the subject would name the tag, and every release invents a new tag. An
    # environment is a name that holds still, so the federated credential is
    # written against `repo:<owner>/<repo>:environment:release` and this is
    # what puts the job inside it. Give it no reviewers, or a release waits for
    # a human who was not told to expect it.
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The unit suite locates the real binary and reads its version, exactly
      # as CI does. Pinned for the same reason: the golden fixtures are what
      # detect contract drift, and a floating install would turn an upstream
      # release into a red build with nothing to say about it.
      - run: npm install --global @haksolot/ank@0.7.0

      - run: npm run lint
      - run: npm run compile
      - run: npm test

      - name: The tag and the manifest must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$declared" ]; then
            echo "tag $tag does not match package.json $declared" >&2
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - name: The icon must be the one the script draws
        run: |
          npm run icon
          git diff --exit-code -- resources/icon.png

      - name: Package
        run: npx vsce package --out "ank-${GITHUB_REF_NAME}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      # The release is created before either registry is touched. A token that
      # has expired then costs a re-run of a publish step, not the build.
      # Idempotent, because the whole point of creating the release first is
      # that a failed publish costs a re-run -- and a re-run replays this step.
      # `gh release create` on a release that exists is an error, which would
      # kill the job here and never reach the registries it was re-run for.
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes ./*.vsix
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # There are two routes to the Marketplace and the repository variable
      # `AZURE_CLIENT_ID` is the switch: Entra where it is set, the PAT while
      # it is not. The PAT route has an end date -- global PATs are retired on
      # December 1 2026, and *All accessible organizations* is the only scope
      # the Marketplace accepts, so every Marketplace PAT is a global one.
      # Setting the variable is the cutover; see docs/releasing.md.
      - name: Sign in to Entra ID
        if: ${{ vars.AZURE_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/v') }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # Reaching the Marketplace needs no role on any subscription, and an
          # app registration outlives whichever subscription happened to be
          # open when it was made. Without this, an identity that can see no
          # subscription fails to sign in at all.
          allow-no-subscriptions: true

      # `vsce --azure-credential` asks a ChainedTokenCredential for a token on
      # the Azure DevOps resource. EnvironmentCredential is tried first and
      # reads no federated token file, so it abstains; AzureCliCredential is
      # next, and that is the one the sign-in above leaves ready. Nothing here
      # holds a secret: the token is minted per run and dies with it.
      - name: Publish to the VS Code Marketplace with Entra ID
        if: ${{ vars.AZURE_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/v') }}
        run: npx vsce publish --azure-credential --packagePath ./*.vsix

      # `vsce` reads VSCE_PAT from the environment. An absent secret arrives as
      # an empty string and produces an authentication error several steps
      # later, so it is named here instead.
      - name: Publish to the VS Code Marketplace with a PAT
        if: ${{ vars.AZURE_CLIENT_ID == '' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT is not set: see docs/releasing.md" >&2
            exit 1
          fi
          npx vsce publish --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Open VSX is where Cursor, Windsurf, VSCodium and the Eclipse clients
      # look. The namespace is created once by hand; see docs/releasing.md.
      # Not `needs`-ordered behind the Marketplace: the two registries are
      # independent, and one of them timing out is not a reason to leave the
      # other unpublished. `!cancelled()` runs it after a failed Marketplace
      # step while still honouring a cancellation.
      - name: Publish to Open VSX
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "OVSX_PAT is not set: see docs/releasing.md" >&2
            exit 1
          fi
          npx --yes ovsx@1.2.0 publish ./*.vsix --pat "${OVSX_PAT}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
